services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: coworker
      POSTGRES_USER: coworker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coworker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworker -d coworker"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies schema migrations, pgvector setup, and RLS policies, then exits.
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /app/packages/db
    command: ["npx", "tsx", "src/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://coworker:${POSTGRES_PASSWORD:-coworker}@postgres:5432/coworker
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://coworker:${POSTGRES_PASSWORD:-coworker}@postgres:5432/coworker
      REDIS_URL: redis://redis:6379
      # Dev-only default. Set a real AUTH_SECRET (openssl rand -hex 32) for anything internet-facing.
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-secret-change-me}
      LOCAL_AUTH: ${LOCAL_AUTH:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-coworker@localhost}
      UPLOAD_DIR: /uploads
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:3001}
      API_PORT: "3001"
      NODE_ENV: production
    volumes:
      - uploads:/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "3001:3001"

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://coworker:${POSTGRES_PASSWORD:-coworker}@postgres:5432/coworker
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UPLOAD_DIR: /uploads
      NODE_ENV: production
    volumes:
      - uploads:/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      api: { condition: service_started }

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, so these must be build args.
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
        NEXT_PUBLIC_LOCAL_AUTH: ${LOCAL_AUTH:-false}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  uploads:
